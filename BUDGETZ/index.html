<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Budgetz — Easy Weekly & Monthly Budgeting</title>

  <!-- Chart.js (for the summary chart) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Budgetz</h1>
      <p class="tag">Simple weekly & monthly budgeting</p>
    </header>

    <main>
      <section class="top-row">
        <div class="card small">
          <label for="incomeInput">Total Money In</label>
          <div class="input-row">
            <input id="incomeInput" type="number" min="0" step="0.01" placeholder="Enter total income" />
            <button id="saveIncomeBtn">Save</button>
          </div>
        </div>

        <div class="card small">
          <label>View</label>
          <div class="view-toggle">
            <button class="view-btn active" data-view="monthly">Monthly</button>
            <button class="view-btn" data-view="weekly">Weekly</button>
          </div>
        </div>

        <div class="card small balance-card">
          <label>Balance</label>
          <div id="balanceDisplay" class="balance">$0.00</div>
          <div id="summaryLine" class="summary-line">Expenses: $0.00</div>
        </div>
      </section>

      <section class="card">
        <h2>Add Bill / Expense</h2>
        <form id="addBillForm" class="form-grid">
          <input id="billName" placeholder="Bill name (e.g., Rent)" required />
          <input id="billAmount" type="number" min="0" step="0.01" placeholder="Amount" required />
          <input id="billCategory" placeholder="Category (e.g., Housing)" />
          <input id="billDueDate" type="date" />
          <div class="form-actions">
            <label><input id="billRecurring" type="checkbox" /> Recurring</label>
            <div>
              <button type="submit" class="primary">Add Bill</button>
              <button id="clearForm" type="button">Clear</button>
            </div>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Bills</h2>
        <div id="billsList" class="bills-list"></div>
        <div class="notes">Tip: click "Paid" to temporarily mark a bill paid for the selected period.</div>
      </section>

      <section class="bottom-row">
        <div class="card chart-card">
          <h3>Spending Breakdown</h3>
          <canvas id="expenseChart" width="400" height="300"></canvas>
        </div>

        <div class="card">
          <h3>Quick Actions</h3>
          <button id="exportBtn">Export Data (JSON)</button>
          <button id="importBtn">Import Data</button>
          <input id="importFile" type="file" accept="application/json" style="display:none" />
          <button id="resetBtn" class="danger">Reset All Data</button>
        </div>
      </section>
    </main>

    <footer>
      <small>Budgetz — Built for simple weekly & monthly budgeting • Data stored in your browser</small>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
